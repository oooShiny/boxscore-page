<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Boxscores</title>
  <script>
    var d = new Date();
    var s = d.getFullYear()
      + String(d.getMonth() + 1).padStart(2, '0')
      + String(d.getDate()).padStart(2, '0');
    window.location.replace('boxscores/' + s + '.html');
  </script>
</head>
<body>
  <a id="link" href="">Today's boxscores</a>
  <script>
    var a = document.getElementById('link');
    a.href = 'boxscores/' + s + '.html';
    a.textContent = 'Today\'s boxscores (' + s + ')';
  </script>
</body>
</html>
