name: Generate Daily Boxscores

on:
  schedule:
    - cron: '0 12 * * *'  # noon UTC — catches overnight US games
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate boxscores
        run: python generate.py

      - name: Update index redirect
        run: |
          TODAY=$(date -u +%Y%m%d)
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=boxscores/${TODAY}.html">
            <title>Boxscores</title>
          </head>
          <body>
            <a href="boxscores/${TODAY}.html">Today's boxscores (${TODAY})</a>
          </body>
          </html>
          EOF

      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add boxscores/ index.html
          git diff --staged --quiet || git commit -m "Boxscores $(date -u -d yesterday +%Y-%m-%d)"
          git push
